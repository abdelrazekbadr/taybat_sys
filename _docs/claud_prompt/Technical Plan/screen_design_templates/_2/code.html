        body { font-family: 'Cairo', sans-serif; background-color: #f4fbf4; }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-container-padding">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden">
<header class="flex flex-col items-center pt-stack-lg pb-stack-md px-container-padding text-center">
<div class="w-20 h-20 bg-primary-container/10 rounded-full flex items-center justify-center mb-base">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="eco">eco</span>
</div>
<h1 class="font-h1 text-h1 text-primary tracking-tight mb-2">الطيبات</h1>
<p class="font-body-md text-body-md text-on-surface-variant">تسجيل الدخول</p>
</header>
<main class="px-container-padding pb-stack-lg">
<form class="space-y-stack-md" onsubmit="return false;">
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant mr-1" for="email">البريد الإلكتروني</label>
<div class="relative group">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl py-3 pr-11 pl-4 font-body-md text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary/20 outline-none transition-all placeholder:text-outline-variant/70" id="email" placeholder="example@domain.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant mr-1" for="password">كلمة المرور</label>
<div class="relative group">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl py-3 pr-11 pl-12 font-body-md text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary/20 outline-none transition-all placeholder:text-outline-variant/70" id="password" placeholder="••••••••" type="password"/>
<button class="absolute left-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex justify-start">
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors" href="#">نسيت كلمة المرور؟</a>
</div>
<button class="w-full h-[52px] bg-primary text-on-primary font-h3 text-h3 rounded-xl shadow-sm hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    تسجيل الدخول
                    <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</form>
<div class="mt-stack-lg pt-stack-md border-t border-outline-variant/20">
<div class="flex flex-col items-center gap-stack-sm">
<p class="font-body-md text-body-md text-on-surface-variant">ليس لديك حساب؟</p>
<a class="w-full h-12 flex items-center justify-center font-h3 text-h3 text-secondary border border-secondary rounded-xl hover:bg-secondary/5 transition-colors" href="#">
                        إنشاء حساب جديد
                    </a>
</div>
</div>
</main>
<div class="relative h-48 w-full overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest to-transparent z-10"></div>
<img class="w-full h-full object-cover" data-alt="overhead shot of fresh green vegetables and fruits arranged artistically on a light surface with soft morning light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDuzitaIjKJatJtYn68aRtdWP4CMRxV-faJNiI8kV4JxbCWo9EXkgxDcMIfYgVA56QTmAmc6mskmyxrqedUAJQ8EZSroD4UNZB0J3PS1TRDNrwzreApJW5w5ivWqLbN-sEPyecZAxoufbn6QDlBzIXdwGXFRrHkRb6dCKKrb60lLmS7NiYJbdGdQI7ukajaCPzwQjKudLD0jyGwjugi1p1TN9EVYAYxJsyQvbs8t_7pfpl1p0lhcL_Zzt4FDAn6qkw7V61hlL-1fVS5"/>
</div>
</div>

<p class="font-caption text-caption text-outline">
            باستخدامك للتطبيق، فإنك توافق على <a class="underline" href="#">شروط الخدمة</a> و <a class="underline" href="#">سياسة الخصوصية</a>.
        </p>
