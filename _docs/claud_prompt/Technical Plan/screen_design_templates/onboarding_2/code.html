        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-hidden">

</div>
<button class="text-primary font-label-md text-label-md">تخطي</button>
</header>
<!-- Illustration Section -->
<section class="flex-grow flex flex-col items-center justify-center text-center">
<div class="relative w-full aspect-square mb-stack-lg flex items-center justify-center">

<div class="absolute inset-0 bg-primary-container/10 rounded-full blur-3xl scale-75"></div>
<div class="absolute top-10 left-10 w-16 h-16 bg-secondary-container/20 rounded-full blur-xl"></div>
<div class="relative z-10 w-full max-w-[280px] h-full flex items-center justify-center">
<img alt="Person feeling relieved" class="w-full h-full object-contain rounded-3xl mix-blend-multiply opacity-90" data-alt="A person sitting in a peaceful meditative pose, eyes closed with a gentle smile, surrounded by soft glowing green and blue light rays, minimal artistic style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrIfknnAcp3seGtFWiJESXRgr97Kj1vYsmbJMdg8qeuGQ2qmxJ1IR1nJjWFdCSlRLP9CUOJ-UcmInzJcjpHzRGZfma5kp_NHIt9umpaX5h6EPflpJoEfKudJCfuXdF7RJW7HumbprsSq2aCJpHmc7rz9fR7zLeTOApNPvW5gwgwKUGPivy62tvGf45FaAPGsrb6jPWIxLBfEr8F2Wn8clWsNV7rxDyScuSCF5w8UI0gQXU9Y3slq8Ml8j2EDnxGfao5PEuvU7JfoGy"/>
</div>
</div>

<div class="space-y-stack-sm text-right w-full">
<h1 class="font-h1 text-h1 text-on-surface tracking-tight">راقب شعورك يتحسن</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80 leading-relaxed">
                    كل أسبوع سنسأل عن شعورك ونقيس تحسنك من خلال الراحة والعافية، ليس الأرقام.
                </p>
</div>
<!-- Features Bento-lite Grid -->
<div class="mt-stack-lg grid grid-cols-1 gap-4 w-full text-right">
<div class="bg-surface-container-lowest p-4 rounded-xl border border-surface-container-high flex items-center gap-4 transition-all hover:shadow-sm">
<div class="bg-primary-container/10 p-2 rounded-lg text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">assignment_turned_in</span>
</div>
<span class="font-label-md text-label-md text-on-surface">تقييمات أسبوعية بسيطة</span>
</div>
<div class="bg-surface-container-lowest p-4 rounded-xl border border-surface-container-high flex items-center gap-4 transition-all hover:shadow-sm">
<div class="bg-primary-container/10 p-2 rounded-lg text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">military_tech</span>
</div>
<span class="font-label-md text-label-md text-on-surface">شارات التحفيز لتشجيعك</span>

</div>

<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-h3 text-h3 flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                التالي
                <span class="material-symbols-outlined">arrow_back</span>
</button>
</footer>
</main>
<!-- Support Elements: Decorative Grain Overlays -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-overlay">
<svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<filter id="noiseFilter">
<feturbulence basefrequency="0.65" numoctaves="3" stitchtiles="stitch" type="fractalNoise"></feturbulence>
</filter>
<rect filter="url(#noiseFilter)" height="100%" width="100%"></rect>
</svg>
